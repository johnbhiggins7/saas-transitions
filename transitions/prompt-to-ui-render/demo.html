<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <meta name="hf-transition" content="start=2;duration=1.1" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="../../shared/ui-kit.css" />
    <style>
      :root { --sk: #e2e7ef; } /* skeleton grey: one shade darker than --surface-2 so it reads on the tiles */

      /* ---- Scene A: assistant prompt ---- */
      .ask { position: absolute; left: 0; top: 326px; width: 1920px; text-align: center; }
      .ask .h2 { margin-top: 14px; }
      .chips { position: absolute; left: 0; top: 626px; width: 1920px; display: flex; justify-content: center; gap: 12px; }
      .chips .pill { height: 40px; padding: 0 18px; font-size: 17px; font-weight: 500; background: var(--surface); border: 1px solid var(--border); }

      /* The shell is the morphing object: prompt bar (A) -> dashboard card (B). Geometry mirrors PROMPT/CARD in the script.
         It tweens x/y + width/height, not scale: scale would stretch the border, the radius and the text. */
      #shell {
        position: absolute; left: 360px; top: 480px; width: 1200px; height: 120px; z-index: 2;
        border-radius: 26px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg);
        outline: 3px solid rgba(99, 91, 255, 0); outline-offset: 3px; overflow: hidden;
      }
      /* Everything inside is anchored to the shell's top-left, so the prompt row rides up to become the card header. */
      .divider { position: absolute; left: 0; right: 0; top: 118px; height: 1px; background: var(--border); }
      #line { position: absolute; left: 44px; top: 0; height: 118px; display: flex; align-items: center; font-size: 40px; letter-spacing: -0.01em; }
      .word { position: relative; display: inline-block; --p: -32; }
      /* --p (% of the text width) drives every layer of the compile at once, left to right:
         skeleton line | glint at p | text erasing over p..p+12 | text lit indigo->sky over p..p+30 | plain ink. */
      .txt {
        white-space: pre; color: transparent; -webkit-background-clip: text; background-clip: text;
        background-image: linear-gradient(90deg, #635bff calc(var(--p) * 1%), #0ea5e9 calc(var(--p) * 1% + 12%), #635bff calc(var(--p) * 1% + 21%), var(--ink) calc(var(--p) * 1% + 30%));
        -webkit-mask-image: linear-gradient(90deg, transparent calc(var(--p) * 1%), #000 calc(var(--p) * 1% + 12%));
        mask-image: linear-gradient(90deg, transparent calc(var(--p) * 1%), #000 calc(var(--p) * 1% + 12%));
      }
      .skel-line {
        position: absolute; left: 0; right: 0; top: 8px; bottom: 8px; border-radius: 10px; background: var(--sk);
        -webkit-mask-image: linear-gradient(90deg, #000 calc(var(--p) * 1% - 12%), transparent calc(var(--p) * 1%));
        mask-image: linear-gradient(90deg, #000 calc(var(--p) * 1% - 12%), transparent calc(var(--p) * 1%));
      }
      /* One soft ellipse, no white core: white on a white bar vanishes and splits the glint into two blobs. */
      .band { position: absolute; top: -20px; bottom: -20px; width: 200px; left: calc(var(--p) * 1% - 100px); opacity: 0; border-radius: 50%; filter: blur(10px);
        background: linear-gradient(90deg, rgba(122, 115, 255, 0), rgba(122, 115, 255, 0.55) 35%, rgba(14, 165, 233, 0.5) 65%, rgba(14, 165, 233, 0)); }
      #placeholder { position: absolute; left: 48px; top: 0; height: 118px; display: flex; align-items: center; font-size: 40px; letter-spacing: -0.01em; color: var(--muted); }
      #send { position: absolute; right: 20px; top: 21px; width: 76px; height: 76px; border-radius: 18px; background: #c9c6ff; color: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; z-index: 2; }
      #send svg { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; }
      #send .lbl { font-size: 21px; font-weight: 600; opacity: 0; }
      #send-ring { position: absolute; right: 20px; top: 21px; width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 0 0 4px rgba(99, 91, 255, 0.45); opacity: 0; }

      /* ---- Scene B: the generated dashboard, in card coordinates ---- */
      #title { position: absolute; left: 44px; top: 0; height: 118px; display: flex; align-items: center; gap: 18px; font-size: 36px; font-weight: 650; letter-spacing: -0.02em; opacity: 0; }
      #title .pill { height: 34px; font-size: 16px; }
      #title .pill svg { width: 15px; height: 15px; margin-right: 6px; }
      #range { position: absolute; right: 180px; top: 40px; height: 38px; padding: 0 16px; font-size: 16px; opacity: 0; }
      .tile { position: absolute; border-radius: 14px; opacity: 0; }
      .tile .sk, .tile .real { position: absolute; inset: 0; padding: inherit; }
      .tile .real { opacity: 0; }
      .b { display: block; background: var(--sk); border-radius: 6px; }
      .kpi { top: 142px; width: 361px; height: 150px; padding: 20px 24px; background: var(--surface-2); }
      .kpi .card-value { font-size: 38px; line-height: 1.2; }
      .panel { top: 316px; height: 522px; padding: 26px 28px; border: 1px solid var(--border); background: var(--surface); }
      #chart { left: 40px; width: 998px; }
      #plan { left: 1062px; width: 496px; }
      .phead { display: flex; align-items: center; justify-content: space-between; height: 32px; }
      .axis { display: flex; justify-content: space-between; padding: 10px 4px 0; font-size: 14px; color: var(--muted); }
      .sk-block { position: absolute; left: 28px; right: 28px; top: 84px; bottom: 28px; border-radius: 10px; background: var(--surface-2); }
      .sk-bars { display: flex; align-items: flex-end; gap: 10px; height: 384px; margin-top: 50px; }
      .sk-bars .b { flex: 1; border-radius: 6px 6px 3px 3px; }
      #plan .bars { height: 390px; margin-top: 28px; gap: 10px; }
      /* Render pass: white over the grey skeletons, a faint indigo trail over white. Clipped by the shell. */
      #sweep { position: absolute; top: 0; bottom: 0; left: 0; width: 420px; z-index: 1;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.9) 45%, rgba(99, 91, 255, 0.1) 62%, rgba(99, 91, 255, 0)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="s1" class="scene dots">
        <div class="ask">
          <div class="eyebrow">Northwind AI</div>
          <div class="h2">What should we build today?</div>
        </div>

        <div id="shell">
          <div class="divider"></div>
          <div id="placeholder">Ask Northwind to build anything…</div>
          <div id="line"><span class="word"><span class="txt" id="txt"></span><span class="skel-line"></span><span class="band"></span></span><span class="caret" id="caret"></span></div>
          <div id="title">Q3 revenue <span class="pill indigo"><svg viewBox="0 0 24 24"><path d="M12 2 L14.2 9.8 L22 12 L14.2 14.2 L12 22 L9.8 14.2 L2 12 L9.8 9.8 Z" fill="currentColor"/></svg>Generated</span></div>
          <div id="range" class="pill">Jul 1 – Sep 30</div>
          <div id="send-ring"></div>
          <div id="send"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19 V5 M5 12 L12 5 L19 12" /></svg><span class="lbl">Share</span></div>

          <div id="k1" class="tile kpi" style="left: 40px">
            <div class="sk"><i class="b" style="width: 96px; height: 14px"></i><i class="b" style="width: 168px; height: 34px; margin-top: 18px"></i><i class="b" style="width: 72px; height: 22px; margin-top: 16px"></i></div>
            <div class="real"><div class="card-label">Revenue</div><div class="card-value">$1.28M</div><span class="delta up">+24%</span></div>
          </div>
          <div id="k2" class="tile kpi" style="left: 425px">
            <div class="sk"><i class="b" style="width: 120px; height: 14px"></i><i class="b" style="width: 140px; height: 34px; margin-top: 18px"></i><i class="b" style="width: 72px; height: 22px; margin-top: 16px"></i></div>
            <div class="real"><div class="card-label">Net new ARR</div><div class="card-value">$214k</div><span class="delta up">+18%</span></div>
          </div>
          <div id="k3" class="tile kpi" style="left: 810px">
            <div class="sk"><i class="b" style="width: 104px; height: 14px"></i><i class="b" style="width: 112px; height: 34px; margin-top: 18px"></i><i class="b" style="width: 84px; height: 22px; margin-top: 16px"></i></div>
            <div class="real"><div class="card-label">Expansion</div><div class="card-value">31%</div><span class="delta up">+6 pts</span></div>
          </div>
          <div id="k4" class="tile kpi" style="left: 1195px">
            <div class="sk"><i class="b" style="width: 80px; height: 14px"></i><i class="b" style="width: 120px; height: 34px; margin-top: 18px"></i><i class="b" style="width: 92px; height: 22px; margin-top: 16px"></i></div>
            <div class="real"><div class="card-label">Churn</div><div class="card-value">1.6%</div><span class="delta up">−0.4 pts</span></div>
          </div>

          <div id="chart" class="tile panel">
            <div class="sk"><i class="b" style="width: 180px; height: 22px; margin-top: 5px"></i><div class="sk-block"></div></div>
            <div class="real">
              <div class="phead"><div class="h3">Revenue</div><div class="legend"><span><i></i>Q3</span><span><i style="background: #c9c6ff"></i>Q2</span></div></div>
              <svg class="chart-svg" viewBox="0 0 942 376" preserveAspectRatio="none" style="height: 376px; margin-top: 24px">
                <line class="chart-grid" x1="0" y1="94" x2="942" y2="94" />
                <line class="chart-grid" x1="0" y1="188" x2="942" y2="188" />
                <line class="chart-grid" x1="0" y1="282" x2="942" y2="282" />
                <path d="M0,316 C80,308 120,292 157,295 S270,280 314,272 S428,254 471,250 S588,236 628,232 S738,218 785,214 S888,200 942,192" fill="none" stroke="#c9c6ff" stroke-width="3" stroke-dasharray="8 8" />
                <path id="area" class="chart-area" d="M0,296 C70,280 110,244 157,252 S260,280 314,224 S418,186 471,194 S578,156 628,138 S738,146 785,108 S888,70 942,52 L942,376 L0,376 Z" />
                <path id="q3" class="chart-line" d="M0,296 C70,280 110,244 157,252 S260,280 314,224 S418,186 471,194 S578,156 628,138 S738,146 785,108 S888,70 942,52" stroke-dasharray="1200" stroke-dashoffset="1200" />
              </svg>
              <div class="axis"><span>Jul</span><span>Aug</span><span>Sep</span></div>
            </div>
          </div>
          <div id="plan" class="tile panel">
            <div class="sk">
              <i class="b" style="width: 220px; height: 22px; margin-top: 5px"></i>
              <div class="sk-bars"><i class="b" style="height: 30%"></i><i class="b" style="height: 38%"></i><i class="b" style="height: 34%"></i><i class="b" style="height: 44%"></i><i class="b" style="height: 40%"></i><i class="b" style="height: 50%"></i><i class="b" style="height: 46%"></i><i class="b" style="height: 56%"></i><i class="b" style="height: 52%"></i><i class="b" style="height: 62%"></i><i class="b" style="height: 58%"></i><i class="b" style="height: 68%"></i></div>
            </div>
            <div class="real">
              <div class="phead"><div class="h3">New revenue / week</div><span class="delta up" style="margin-top: 0">+18%</span></div>
              <div class="bars">
                <div class="bar soft" style="height: 36%"></div><div class="bar soft" style="height: 44%"></div><div class="bar soft" style="height: 40%"></div><div class="bar soft" style="height: 52%"></div>
                <div class="bar" style="height: 50%"></div><div class="bar" style="height: 61%"></div><div class="bar" style="height: 58%"></div><div class="bar" style="height: 70%"></div>
                <div class="bar" style="height: 66%"></div><div class="bar" style="height: 80%"></div><div class="bar" style="height: 88%"></div><div class="bar" style="height: 100%"></div>
              </div>
            </div>
          </div>
          <div id="sweep"></div>
        </div>

        <div class="chips"><span class="pill">Churn by cohort</span><span class="pill">Pipeline forecast</span><span class="pill">Weekly signups</span></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // ---- Scene A entrance ----
      tl.fromTo(".ask", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#shell", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.08);
      tl.fromTo(".chips .pill", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, stagger: 0.05, ease: "power3.out" }, 0.18);

      // ---- Typing: one span per character, revealed with tl.set so any seek lands on the right character ----
      const TEXT = "Build a Q3 revenue dashboard";
      const TYPE_START = 0.55, TYPE_END = 1.6;
      const txt = document.getElementById("txt");
      const chars = [...TEXT].map((c) => {
        const s = document.createElement("span");
        s.textContent = c;
        s.style.display = "none"; // display, not opacity: hidden chars must not take width, or the caret sits at the end
        txt.appendChild(s);
        return s;
      });
      const rnd = (i) => { const x = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return x - Math.floor(x); }; // seeded, not Math.random
      const gaps = chars.map((_, i) => 0.7 + 0.6 * rnd(i) + (TEXT[i - 1] === " " ? 0.7 : 0)); // uneven cadence, beat after spaces
      const total = gaps.reduce((a, g) => a + g, 0);
      let acc = 0;
      chars.forEach((s, i) => {
        acc += gaps[i];
        tl.set(s, { display: "inline" }, TYPE_START + ((acc - gaps[0]) / (total - gaps[0])) * (TYPE_END - TYPE_START));
      });
      tl.set("#placeholder", { opacity: 0 }, TYPE_START);
      tl.set("#send", { backgroundColor: "#635bff" }, TYPE_START);

      // ---- Prompt-to-UI Render ----
      const T = 2.0; // transition start (send already pressed)
      const D = 1.1; // compile + unfold + render pass (34f @ 30fps)
      const PROMPT = { x: 360, y: 480, w: 1200, h: 120, r: 26 }; // #shell in scene A (matches CSS)
      const CARD = { x: 160, y: 100, w: 1600, h: 880, r: 24 };   // #shell in scene B

      // Telegraph: press send, caret goes away.
      tl.to("#send", { scale: 0.88, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, T - 0.26);
      tl.fromTo("#send-ring", { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.3, duration: 0.4, ease: "power2.out", immediateRender: false }, T - 0.2); // else its from-state shows from frame 0
      tl.set("#caret", { opacity: 0 }, T - 0.16);

      // 1. Compile (10f): the glint crosses the text, lighting it indigo->sky just ahead and leaving a skeleton line behind.
      // --p runs -32 -> 115 so the lit stretch (up to p+30) starts and ends off the text.
      tl.fromTo(".word", { "--p": -32 }, { "--p": 115, duration: 0.33, ease: "power2.inOut" }, T);
      tl.fromTo(".band", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, T + 0.06);
      tl.to(".band", { opacity: 0, duration: 0.1, ease: "power1.in" }, T + 0.18); // gone as the last letter erases (~T+0.26), not drifting on empty bar
      tl.to("#shell", { outlineColor: "rgba(99, 91, 255, 0.3)", duration: 0.2, ease: "power2.out" }, T);

      // 2. Morph (~21f): width leads, height follows, so the bar widens and then drops open like a drawer.
      // Position moves as x/y (sub-pixel transforms); left/top snap to whole pixels and stutter in the expo tail.
      tl.fromTo("#shell", { x: 0, width: PROMPT.w }, { x: CARD.x - PROMPT.x, width: CARD.w, duration: 0.55, ease: "expo.inOut" }, T + 0.1);
      tl.fromTo("#shell", { y: 0, height: PROMPT.h, borderRadius: PROMPT.r }, { y: CARD.y - PROMPT.y, height: CARD.h, borderRadius: CARD.r, duration: 0.6, ease: "expo.inOut" }, T + 0.2);
      tl.to(".ask", { y: -40, opacity: 0, duration: 0.3, ease: "power2.in" }, T + 0.2);
      tl.to(".chips", { y: 40, opacity: 0, duration: 0.3, ease: "power2.in" }, T + 0.2);

      // 3. Skeleton tiles pop in while the frame is still opening.
      tl.fromTo(".tile", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.35, stagger: 0.04, ease: "power3.out" }, T + 0.34);

      // 4. Render pass: a second, wider shimmer crosses the card and each tile resolves as the sweep reaches it.
      tl.to("#shell", { outlineColor: "rgba(99, 91, 255, 0)", duration: 0.4, ease: "power2.out" }, T + 0.8); // end of the unfold
      const R0 = T + 0.62, SW = 0.5, SPAN = CARD.w + 420; // sweep start, duration, travel (#sweep is 420px wide)
      tl.fromTo("#sweep", { x: -420 }, { x: CARD.w, duration: SW, ease: "sine.inOut" }, R0);
      // When the sweep's center is 60px into something at card-x: inverse of sine.inOut, so the resolve tracks the band exactly.
      const at = (x) => R0 + (SW * Math.acos(1 - (2 * (x + 270)) / SPAN)) / Math.PI;
      tl.to(".word", { opacity: 0, duration: 0.2, ease: "power1.out" }, at(44));
      tl.fromTo("#title", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, at(44) + 0.04);
      [["#k1", 40], ["#k2", 425], ["#k3", 810], ["#k4", 1195], ["#chart", 40], ["#plan", 1062]].forEach(([id, x]) => {
        tl.to(`${id} .sk`, { opacity: 0, duration: 0.2, ease: "power1.out" }, at(x));
        tl.fromTo(`${id} .real`, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, at(x) + 0.04);
      });
      tl.to("#q3", { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, at(40) + 0.08);
      tl.fromTo("#area", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, at(40) + 0.55); // after the line passes, or the fill runs ahead of it
      tl.fromTo("#plan .bar", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.5, stagger: 0.03, ease: "power3.out" }, at(1062) + 0.04);
      // The send button rides the right edge and becomes the card's Share action.
      tl.fromTo("#range", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, at(1300));
      tl.to("#send", { width: 140, duration: 0.45, ease: "expo.out" }, at(1440));
      tl.to("#send svg", { opacity: 0, duration: 0.12, ease: "power1.out" }, at(1440));
      tl.to("#send .lbl", { opacity: 1, duration: 0.25, ease: "power1.out" }, at(1440) + 0.04);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
